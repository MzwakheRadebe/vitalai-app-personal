services:
  - type: web
    name: vitalai-chatbot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: TZ
        value: Africa/Johannesburg
      - key: SQLITE_PATH
        value: /tmp/local_offline.db
      - key: ALLOWED_ORIGINS
        value: ""
      - key: DATABASE_URL
        value: ""
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""
      - key: AI_SERVICE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        value: ""
