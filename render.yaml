services:
  - type: web
    name: vitalai-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: TZ
        value: Africa/Johannesburg

      # Security — set these manually in Render dashboard (do not hardcode here)
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # CORS — set to your Vercel frontend URL after deploying frontend
      - key: ALLOWED_ORIGINS
        sync: false

      # AI service — optional, leave blank to use keyword/ML fallback
      - key: AI_SERVICE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        sync: false

      # SQLite fallback (used if DATABASE_URL is not set)
      - key: SQLITE_PATH
        value: /tmp/local_offline.db
