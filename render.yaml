services:
  - type: web
    name: VitalAi-chatbot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SQLITE_PATH
        value: /tmp/local_offline.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MYSQL_URL
        value: mysql://DB_USER_REDACTED:$REDACTED_PASSWORD@your-rds-endpoint:3306/vitalai_prod
      - key: MONGO_URL
        value: mongodb+srv://DB_USER_REDACTED:REDACTED_PASSWORD@MONGO_HOST_REDACTED/vitalai_analytics
                           


